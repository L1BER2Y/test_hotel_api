server:
  port: 8092
  servlet:
    context-path: /property-view

spring:
  application:
    name: test-hotels-api

  datasource:
    url: jdbc:h2:mem:hotelsDB;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  liquibase:
    changelog: classpath:db/changelog/db.changelog-master.xml
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
